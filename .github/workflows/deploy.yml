name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Nota: la suite de tests todavia cubre el comportamiento multimarca del
      # bot original. Este despliegue es Dyson-only, asi que se ejecuta de forma
      # informativa (no bloquea). Actualizar tests/ y quitar continue-on-error.
      - name: Run tests
        continue-on-error: true
        run: python -m pytest -v --tb=short

  # ---------------------------------------------------------------------------
  # Despliegue al VPS: DESACTIVADO a proposito.
  #
  # El pipeline original hacia `docker compose up -d` en /opt/whatsapp-bot del
  # VPS y publicaba la imagen ghcr.io/keysiwin12/bot-wsp:latest, que es la del
  # bot que YA esta en produccion en otro numero. Ejecutarlo desde este repo
  # reemplazaria esa integracion.
  #
  # Este bot (numero +34 606 806 376, bandeja 7 de Chatwoot, Dyson-only) se
  # despliega en un destino separado. Cuando este definido el hosting:
  #   1. Crear los secrets del repo: VPS_HOST, VPS_USER, VPS_SSH_KEY (o
  #      VPS_PASSWORD), GHCR_TOKEN.
  #   2. Usar una IMAGE_NAME nueva (p.ej. inmaculadaoc81/bot-wsp-dyson) y una
  #      carpeta/compose propios en el VPS (p.ej. /opt/whatsapp-bot-dyson) con
  #      su propio puerto, para que corra JUNTO al bot antiguo, no encima.
  # ---------------------------------------------------------------------------
